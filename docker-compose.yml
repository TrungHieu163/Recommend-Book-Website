# docker-compose.yml — Đầy đủ dịch vụ cho dự án (Hoàn thiện bởi [B])
services:
  db:
    image: mysql:8.4
    container_name: book_ai_store_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-book_ai_store}
      MYSQL_USER: ${DB_USER:-book_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-booksecret}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: book_ai_store_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyChangeMe123456}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: ${NODE_ENV:-development}
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: book_ai_store_adminer
    profiles:
      - tools
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: book_ai_store_ollama
    profiles:
      - local-ai
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  app:
    build: .
    container_name: book_ai_store_app
    env_file: .env
    environment:
      # Ghi đè để trỏ tới mạng nội bộ docker
      DB_HOST: db
      DB_PORT: "3306"
      MEILI_HOST: http://meilisearch:7700
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads/books
    restart: unless-stopped

volumes:
  mysql_data:
  meili_data:
  uploads_data:
  ollama_data:
